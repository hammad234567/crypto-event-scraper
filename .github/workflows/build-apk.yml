name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Write app config
        run: |
          cat > app/www/config.js <<EOF
          window.APP_CONFIG = { url: "${{ secrets.SUPABASE_URL }}", key: "${{ secrets.SUPABASE_ANON_KEY }}" };
          EOF

      - name: Install and add Android
        working-directory: app
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk crypto-events.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Crypto Events APK #${{ github.run_number }}
          body: Debug APK. Download crypto-events.apk and install on Android.
          files: crypto-events.apk
          make_latest: true

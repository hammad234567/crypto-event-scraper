<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<title>Crypto Events</title>
<style>
  :root { --bg:#0f1420; --card:#171e2e; --text:#e8ecf4; --muted:#8b95a9; --accent:#f0b90b; --line:#25304a; --new:#22c55e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding-top:env(safe-area-inset-top); }
  header { position:sticky; top:0; z-index:5; background:var(--bg); padding:14px 16px 10px; border-bottom:1px solid var(--line); }
  .top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  h1 { font-size:20px; margin:0; } h1 span { color:var(--accent); }
  button.refresh { background:var(--accent); color:#111; border:0; border-radius:10px; padding:8px 14px; font-weight:600; font-size:14px; }
  button.refresh:disabled { opacity:.5; }
  input.search { width:100%; margin-top:10px; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:15px; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:10px 0 2px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--muted); font-size:13px; }
  .chip.on { background:var(--accent); color:#111; border-color:var(--accent); font-weight:600; }
  main { padding:12px 16px 40px; }
  .status { color:var(--muted); font-size:13px; margin:4px 0 10px; }
  .error { color:#ff7b7b; background:#2a1518; border:1px solid #5a2327; padding:12px; border-radius:10px; font-size:14px; }
  a.card { display:block; text-decoration:none; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .ex { font-size:12px; font-weight:700; color:var(--accent); letter-spacing:.4px; text-transform:uppercase; }
  .badge { font-size:11px; font-weight:700; color:#04140a; background:var(--new); padding:2px 8px; border-radius:999px; }
  .name { font-size:16px; line-height:1.35; margin:6px 0; }
  .time { font-size:12px; color:var(--muted); }
  .empty { text-align:center; color:var(--muted); padding:40px 10px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Crypto <span>Events</span></h1>
    <button class="refresh" id="refresh">Refresh</button>
  </div>
  <input class="search" id="search" type="search" placeholder="Search events...">
  <div class="chips" id="chips"></div>
</header>
<main>
  <div class="status" id="status"></div>
  <div id="list"></div>
</main>
<script src="config.js"></script>
<script>
(function () {
  var cfg = window.APP_CONFIG || {};
  var base = (cfg.url || "").replace(/\/+$/, "");
  var all = [], selected = "All", query = "";
  var $list = document.getElementById("list");
  var $chips = document.getElementById("chips");
  var $status = document.getElementById("status");
  var $refresh = document.getElementById("refresh");
  var $search = document.getElementById("search");

  function timeAgo(iso) {
    var s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (isNaN(s)) return "";
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " hr ago";
    return Math.floor(s / 86400) + " day ago";
  }
  function showError(msg) {
    $list.textContent = "";
    var d = document.createElement("div");
    d.className = "error"; d.textContent = msg;
    $list.appendChild(d);
  }
  function renderChips() {
    var names = ["All"];
    all.forEach(function (e) { if (names.indexOf(e.exchange_name) === -1) names.push(e.exchange_name); });
    $chips.textContent = "";
    names.forEach(function (n) {
      var b = document.createElement("button");
      b.className = "chip" + (n === selected ? " on" : "");
      b.textContent = n;
      b.onclick = function () { selected = n; renderChips(); renderList(); };
      $chips.appendChild(b);
    });
  }
  function renderList() {
    var q = query.trim().toLowerCase();
    var rows = all.filter(function (e) {
      if (selected !== "All" && e.exchange_name !== selected) return false;
      if (q && (e.event_name + " " + e.exchange_name).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    $status.textContent = rows.length + " events";
    $list.textContent = "";
    if (!rows.length) {
      var d = document.createElement("div");
      d.className = "empty";
      d.textContent = all.length ? "Koi event nahi mila." : "Abhi tak koi event save nahi hua.";
      $list.appendChild(d);
      return;
    }
    rows.forEach(function (e) {
      var a = document.createElement("a");
      a.className = "card"; a.href = e.event_url || "#"; a.target = "_blank"; a.rel = "noopener";
      var row = document.createElement("div"); row.className = "row";
      var ex = document.createElement("span"); ex.className = "ex"; ex.textContent = e.exchange_name;
      row.appendChild(ex);
      if (Date.now() - new Date(e.created_at).getTime() < 86400000) {
        var bd = document.createElement("span"); bd.className = "badge"; bd.textContent = "NEW";
        row.appendChild(bd);
      }
      var nm = document.createElement("div"); nm.className = "name"; nm.textContent = e.event_name;
      var tm = document.createElement("div"); tm.className = "time"; tm.textContent = timeAgo(e.created_at);
      a.appendChild(row); a.appendChild(nm); a.appendChild(tm);
      $list.appendChild(a);
    });
  }
  function load() {
    if (!base || !cfg.key) {
      showError("App ki Supabase settings (URL / anon key) build mein nahi daali gayi. GitHub Secrets check karein.");
      return;
    }
    $refresh.disabled = true;
    $status.textContent = "Loading...";
    fetch(base + "/rest/v1/events?select=*&order=created_at.desc&limit=300", {
      headers: { apikey: cfg.key, Authorization: "Bearer " + cfg.key }
    })
      .then(function (r) { if (!r.ok) throw new Error("Server error " + r.status); return r.json(); })
      .then(function (rows) { all = Array.isArray(rows) ? rows : []; renderChips(); renderList(); })
      .catch(function (err) { $status.textContent = ""; showError("Events load nahi hue: " + err.message + ". Internet aur Supabase key check karein."); })
      .then(function () { $refresh.disabled = false; });
  }
  $refresh.onclick = load;
  $search.oninput = function () { query = $search.value; renderList(); };
  document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });
  load();
})();
</script>
</body>
</html>

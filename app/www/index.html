<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<title>Crypto Events</title>
<style>
  :root { --bg:#0f1420; --card:#171e2e; --text:#e8ecf4; --muted:#8b95a9; --accent:#f0b90b; --line:#25304a; --new:#22c55e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding-top:env(safe-area-inset-top); }
  button { font-family:inherit; }
  header { position:sticky; top:0; z-index:5; background:var(--bg); padding:14px 16px 12px; border-bottom:1px solid var(--line); }
  .top { display:flex; align-items:center; gap:10px; }
  .grow { flex:1; min-width:0; }
  h1 { font-size:20px; margin:0; } h1 span { color:var(--accent); }
  .sub { color:var(--muted); font-size:13px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .btn { background:var(--accent); color:#111; border:0; border-radius:10px; padding:8px 14px; font-weight:600; font-size:14px; }
  .btn.ghost { background:var(--card); color:var(--text); border:1px solid var(--line); }
  .btn:disabled { opacity:.5; }
  .back { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:10px; width:38px; height:38px; font-size:20px; line-height:1; flex:0 0 auto; }
  main { padding:14px 16px 110px; }
  .error { color:#ff7b7b; background:#2a1518; border:1px solid #5a2327; padding:12px; border-radius:10px; font-size:14px; margin-bottom:12px; }

  .bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; }
  .bar .txt { color:var(--muted); font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:14px; }
  .tile { position:relative; background:var(--card); border:1px solid var(--line); border-radius:22px; padding:22px 10px 16px; text-align:center; color:inherit; cursor:pointer; }
  .tile:active { transform:scale(.97); }
  .tile.has-new { border-color:var(--new); }
  .logowrap { width:84px; height:84px; margin:0 auto 10px; }
  .logo { width:84px; height:84px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden; color:#fff; font-weight:800; font-size:26px; }
  .logo img { width:100%; height:100%; object-fit:cover; display:block; }
  .logo img.fav { width:60%; height:60%; object-fit:contain; }
  .logo.sm { width:40px; height:40px; font-size:14px; }
  .badge { position:absolute; top:10px; right:10px; background:var(--new); color:#04140a; font-size:12px; font-weight:800; padding:3px 10px; border-radius:999px; white-space:nowrap; }
  .badge.rd { background:transparent; color:var(--muted); border:1px solid var(--line); font-weight:600; }
  .tname { font-size:17px; font-weight:800; }
  .tcount { font-size:12px; color:var(--muted); margin-top:3px; }

  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tab { flex:1; padding:9px 10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--muted); font-size:14px; font-weight:600; }
  .tab.on { background:var(--accent); color:#111; border-color:var(--accent); }

  /* event cards (photo ke saath) */
  .ecard { position:relative; background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden; margin-bottom:14px; cursor:pointer; }
  .ecard:active { transform:scale(.99); }
  .ecard.unread { border-color:var(--new); }
  .ecard.read { opacity:.6; }
  .banner { position:relative; height:150px; display:flex; align-items:flex-end; padding:12px 14px; overflow:hidden; }
  .banner img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .banner .bt { position:relative; font-weight:900; font-size:21px; line-height:1.15; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.45); max-width:85%; }
  .banner.hero { height:210px; border-radius:0; margin:-14px -16px 0; }
  .banner.hero .bt { font-size:28px; }
  .pill { position:absolute; left:12px; top:12px; z-index:2; font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; }
  .pill.new { color:#04140a; background:var(--new); }
  .pill.rd { color:var(--muted); background:rgba(15,20,32,.75); border:1px solid var(--line); }
  .einfo { padding:12px 14px 14px; }
  .etitle { font-size:16px; font-weight:700; line-height:1.3; }
  .edesc { font-size:13px; color:#aab3c8; line-height:1.4; margin-top:6px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .etime { font-size:12px; color:var(--muted); margin-top:8px; }
  .empty { text-align:center; color:var(--muted); padding:40px 10px; }

  /* event detail */
  .dsec { padding-top:16px; }
  .drow { display:flex; align-items:center; gap:10px; }
  .dtitle { font-size:20px; font-weight:800; line-height:1.25; margin:12px 0 6px; }
  .chip { display:inline-block; font-size:12px; color:#c7cfdf; background:#1f2840; border-radius:8px; padding:4px 9px; margin-right:6px; }
  .h { font-size:13px; font-weight:800; color:var(--muted); margin:18px 0 6px; letter-spacing:.5px; }
  .dtext { font-size:14px; line-height:1.55; color:#c7cfdf; }
  .link { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 10px 10px 12px; }
  .link .u { flex:1; min-width:0; font-size:13px; color:#8fb4ff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .link .cp { background:#1f2840; border:1px solid #2d3a5c; color:var(--text); border-radius:9px; padding:7px 14px; font-size:13px; font-weight:700; }
  .link .cp.ok { background:#14351f; border-color:var(--new); color:var(--new); }
  a.cta { position:fixed; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); background:var(--accent); color:#111; text-decoration:none; text-align:center; font-weight:800; font-size:16px; border-radius:14px; padding:14px; }
</style>
</head>
<body>
<header id="header"></header>
<main id="main"></main>

<script src="config.js"></script>
<script src="logos.js"></script>
<script>
(function () {
  var cfg = window.APP_CONFIG || {};
  var base = (cfg.url || "").replace(/\/+$/, "");

  // Exchange ki list: n = naam (database wala), d = website (logo ke liye)
  var EXCHANGES = [
    { n: "KCEX", d: "kcex.com" },
    { n: "BTCC", d: "btcc.com" },
    { n: "Bitunix", d: "bitunix.com" },
    { n: "XT", d: "xt.com" },
    { n: "Toobit", d: "toobit.com" },
    { n: "Phemex", d: "phemex.com" },
    { n: "BloFin", d: "blofin.com" },
    { n: "EasiCoin", d: "easicoin.io" },
    { n: "Bitbase", d: "bitbase.com" },
    { n: "AlphaX", d: "alphax.com" },
    { n: "Yubit", d: "yubit.com" },
    { n: "WEEX", d: "weex.com" },
    { n: "MEXC", d: "mexc.com" },
    { n: "Zoomex", d: "zoomex.com" },
    { n: "Tapbit", d: "tapbit.com" },
    { n: "Hibit", d: "hibt.com" }
  ];

  var $header = document.getElementById("header");
  var $main = document.getElementById("main");

  var events = [];
  var byEx = {};
  var current = null;      // null = home, warna exchange ka naam
  var currentEv = null;    // khula hua event (detail screen)
  var tab = "unread";
  var loadError = "";
  var loading = false;

  // ---------- read / unread (is phone mein save hota hai) ----------
  var readSet = new Set();
  try { readSet = new Set(JSON.parse(localStorage.getItem("readIds") || "[]")); } catch (e) {}
  function saveRead() {
    try { localStorage.setItem("readIds", JSON.stringify(Array.from(readSet))); } catch (e) {}
  }
  function isUnread(e) { return !readSet.has(e.id); }
  function unreadOf(name) { return (byEx[name] || []).filter(isUnread); }
  function totalUnread() {
    var t = 0;
    EXCHANGES.forEach(function (x) { t += unreadOf(x.n).length; });
    return t;
  }

  // ---------- helpers ----------
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function timeAgo(iso) {
    var s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (isNaN(s)) return "";
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " hr ago";
    return Math.floor(s / 86400) + " day ago";
  }
  function hue(name) {
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
    return h;
  }
  function isHttp(u) { return /^https?:\/\//i.test(u || ""); }
  function logo(ex, small) {
    var w = el("div", "logo" + (small ? " sm" : ""));
    var img = new Image();
    img.alt = ex.n;
    img.referrerPolicy = "no-referrer";
    img.onerror = function () {
      w.textContent = ex.n.slice(0, 2).toUpperCase();
      w.style.background = "hsl(" + hue(ex.n) + ",55%,42%)";
    };
    var own = window.LOGOS && window.LOGOS[ex.n];
    if (own) {
      img.src = own;
    } else {
      img.className = "fav";
      img.src = "https://www.google.com/s2/favicons?domain=" + ex.d + "&sz=128";
    }
    w.appendChild(img);
    return w;
  }
  function findEx(name) {
    for (var i = 0; i < EXCHANGES.length; i++) if (EXCHANGES[i].n === name) return EXCHANGES[i];
    return null;
  }
  // event ki photo (exchange ki apni). Photo na ho ya na khule to rangeen background + title
  function banner(e, hero) {
    var h = hue(e.event_name || "x");
    var b = el("div", "banner" + (hero ? " hero" : ""));
    b.style.background = "linear-gradient(135deg,hsl(" + h + ",65%,42%),hsl(" + ((h + 55) % 360) + ",70%,50%))";
    function fallback() {
      b.textContent = "";
      b.appendChild(el("span", "bt", e.event_name));
    }
    if (isHttp(e.image_url)) {
      var im = new Image();
      im.alt = "";
      im.referrerPolicy = "no-referrer";
      im.onerror = fallback;
      im.src = e.image_url;
      b.appendChild(im);
    } else {
      fallback();
    }
    return b;
  }
  function copyText(text, btn) {
    function done() {
      btn.textContent = "Copied ✓";
      btn.className = "cp ok";
      setTimeout(function () { btn.textContent = "Copy"; btn.className = "cp"; }, 1800);
    }
    function legacy() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand("copy"); } catch (x) {}
      document.body.removeChild(ta);
      done();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(legacy);
    } else {
      legacy();
    }
  }

  // ---------- home screen ----------
  function renderHome() {
    current = null;
    currentEv = null;
    $header.textContent = "";
    var top = el("div", "top");
    var g = el("div", "grow");
    var h1 = el("h1");
    h1.appendChild(document.createTextNode("Crypto "));
    h1.appendChild(el("span", "", "Events"));
    g.appendChild(h1);
    top.appendChild(g);
    var rb = el("button", "btn", "Refresh");
    rb.disabled = loading;
    rb.onclick = load;
    top.appendChild(rb);
    $header.appendChild(top);

    $main.textContent = "";
    if (loadError) $main.appendChild(el("div", "error", loadError));

    var bar = el("div", "bar");
    var unread = totalUnread();
    bar.appendChild(el("div", "txt", unread ? unread + " unread" : "Sab read hain"));
    var mb = el("button", "btn ghost", "Mark all read");
    mb.onclick = function () {
      events.forEach(function (e) { readSet.add(e.id); });
      saveRead();
      renderHome();
    };
    bar.appendChild(mb);
    $main.appendChild(bar);

    var grid = el("div", "grid");
    EXCHANGES.forEach(function (ex) {
      var list = byEx[ex.n] || [];
      var un = unreadOf(ex.n).length;
      var tile = el("div", "tile" + (un > 0 ? " has-new" : ""));
      tile.onclick = function () { openEx(ex.n, true); };
      if (un > 0) tile.appendChild(el("span", "badge", un + " NEW"));
      else if (list.length) tile.appendChild(el("span", "badge rd", "Read"));
      var lw = el("div", "logowrap");
      lw.appendChild(logo(ex, false));
      tile.appendChild(lw);
      tile.appendChild(el("div", "tname", ex.n));
      tile.appendChild(el("div", "tcount", list.length ? list.length + (list.length === 1 ? " event" : " events") : "No events"));
      grid.appendChild(tile);
    });
    $main.appendChild(grid);
    window.scrollTo(0, 0);
  }

  // ---------- exchange screen ----------
  function openEx(name, push) {
    if (push) { try { history.pushState({ ex: name }, ""); } catch (e) {} }
    current = name;
    currentEv = null;
    tab = unreadOf(name).length ? "unread" : "all";
    renderEx();
  }
  function backFromEx() {
    if (history.state && history.state.ex) { history.back(); } else { renderHome(); }
  }

  function renderEx() {
    currentEv = null;
    var ex = findEx(current);
    var list = byEx[current] || [];
    var un = unreadOf(current);

    $header.textContent = "";
    var top = el("div", "top");
    var back = el("button", "back", "←");
    back.onclick = backFromEx;
    top.appendChild(back);
    top.appendChild(logo(ex, true));
    var g = el("div", "grow");
    g.appendChild(el("h1", "", ex.n));
    g.appendChild(el("div", "sub", un.length ? un.length + " unread" : "Sab read hain"));
    top.appendChild(g);
    var mb = el("button", "btn ghost", "Mark all read");
    mb.onclick = function () {
      list.forEach(function (e) { readSet.add(e.id); });
      saveRead();
      renderEx();
    };
    top.appendChild(mb);
    $header.appendChild(top);

    $main.textContent = "";
    var tabs = el("div", "tabs");
    [["unread", "Unread (" + un.length + ")"], ["all", "All (" + list.length + ")"]].forEach(function (t) {
      var b = el("button", "tab" + (tab === t[0] ? " on" : ""), t[1]);
      b.onclick = function () { tab = t[0]; renderEx(); };
      tabs.appendChild(b);
    });
    $main.appendChild(tabs);

    var rows = tab === "unread" ? un : list;
    if (!rows.length) {
      $main.appendChild(el("div", "empty",
        list.length ? "Koi unread event nahi." : "Abhi is exchange ka koi event save nahi hua."));
      return;
    }
    rows.forEach(function (e) {
      var unread = isUnread(e);
      var card = el("div", "ecard " + (unread ? "unread" : "read"));
      card.appendChild(banner(e, false));
      card.appendChild(el("span", "pill " + (unread ? "new" : "rd"), unread ? "NEW" : "READ"));
      var info = el("div", "einfo");
      info.appendChild(el("div", "etitle", e.event_name));
      if (e.description) info.appendChild(el("div", "edesc", e.description));
      info.appendChild(el("div", "etime", timeAgo(e.created_at)));
      card.appendChild(info);
      card.onclick = function () { openEvent(e, true); };
      $main.appendChild(card);
    });
  }

  // ---------- event detail screen ----------
  function openEvent(e, push) {
    if (push) { try { history.pushState({ ex: current, ev: e.id }, ""); } catch (x) {} }
    currentEv = e;
    if (isUnread(e)) { readSet.add(e.id); saveRead(); }
    renderEvent();
  }
  function backFromEvent() {
    if (history.state && history.state.ev) { history.back(); } else { renderEx(); }
  }

  function renderEvent() {
    var e = currentEv;
    var ex = findEx(e.exchange_name) || { n: e.exchange_name, d: "" };

    $header.textContent = "";
    var top = el("div", "top");
    var back = el("button", "back", "←");
    back.onclick = backFromEvent;
    top.appendChild(back);
    var g = el("div", "grow");
    g.appendChild(el("div", "sub", ex.n + " · Event"));
    top.appendChild(g);
    $header.appendChild(top);

    $main.textContent = "";
    $main.appendChild(banner(e, true));
    var sec = el("div", "dsec");

    var row = el("div", "drow");
    row.appendChild(logo(ex, true));
    row.appendChild(el("div", "", ex.n));
    row.lastChild.style.fontWeight = "700";
    sec.appendChild(row);

    sec.appendChild(el("div", "dtitle", e.event_name));
    sec.appendChild(el("span", "chip", "Found " + timeAgo(e.created_at)));

    if (e.description) {
      sec.appendChild(el("div", "h", "DETAILS"));
      sec.appendChild(el("div", "dtext", e.description));
    }

    if (isHttp(e.event_url)) {
      sec.appendChild(el("div", "h", "EVENT LINK"));
      var box = el("div", "link");
      box.appendChild(el("span", "u", e.event_url));
      var cp = el("button", "cp", "Copy");
      cp.onclick = function () { copyText(e.event_url, cp); };
      box.appendChild(cp);
      sec.appendChild(box);
    }
    $main.appendChild(sec);

    if (isHttp(e.event_url)) {
      var cta = el("a", "cta", "Open event on " + ex.n + " ↗");
      cta.href = e.event_url;
      cta.target = "_blank";
      cta.rel = "noopener";
      $main.appendChild(cta);
    }
    window.scrollTo(0, 0);
  }

  function render() {
    if (currentEv) renderEvent();
    else if (current) renderEx();
    else renderHome();
  }

  // ---------- data ----------
  function load() {
    if (!base || !cfg.key) {
      loadError = "App ki Supabase settings (URL / anon key) build mein nahi daali gayi. GitHub Secrets check karein.";
      render();
      return;
    }
    loading = true;
    loadError = "";
    if (!currentEv) render();
    fetch(base + "/rest/v1/events?select=*&order=created_at.desc&limit=1000", {
      headers: { apikey: cfg.key, Authorization: "Bearer " + cfg.key }
    })
      .then(function (r) { if (!r.ok) throw new Error("Server error " + r.status); return r.json(); })
      .then(function (rows) {
        events = Array.isArray(rows) ? rows : [];
        byEx = {};
        events.forEach(function (e) {
          (byEx[e.exchange_name] = byEx[e.exchange_name] || []).push(e);
        });
      })
      .catch(function (err) {
        loadError = "Events load nahi hue: " + err.message + ". Internet aur Supabase key check karein.";
      })
      .then(function () { loading = false; if (!currentEv) render(); });
  }

  window.addEventListener("popstate", function (ev) {
    var st = ev.state || {};
    if (st.ev) {
      for (var i = 0; i < events.length; i++) {
        if (events[i].id === st.ev) { current = st.ex; currentEv = events[i]; renderEvent(); return; }
      }
    }
    if (st.ex) { current = st.ex; currentEv = null; renderEx(); return; }
    renderHome();
  });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });
  renderHome();
  load();
})();
</script>
</body>
</html>

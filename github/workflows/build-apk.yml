name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install app dependencies
        working-directory: app
        run: npm install

      - name: Write Supabase config into app
        working-directory: app
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node -e 'require("fs").writeFileSync("www/config.js","window.APP_CONFIG = "+JSON.stringify({url:process.env.SB_URL||"",key:process.env.SB_KEY||""})+";\n")'

      - name: Create Android project
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk crypto-events.apk
          gh release create "apk-${{ github.run_number }}" crypto-events.apk \
            --title "Crypto Events APK #${{ github.run_number }}" \
            --notes "Debug APK. Download crypto-events.apk and install on Android."
